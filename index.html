<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y.T_ | Personal Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            background-image: 
                radial-gradient(rgba(56,189,248,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .card {
            background-color: rgba(30,41,59,0.75);
            border: 1px solid rgba(56,189,248,0.18);
            border-radius: 14px;
            padding: 42px 36px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-bottom: 36px;
            padding-bottom:20px;
            border-bottom: 1px solid rgba(56,189,248,0.15);
        }
        h2 {
            color:#38bdf8;
            margin:32px 0 14px;
            font-size:1.4rem;
        }
        p {
            line-height:1.8;
            font-size:1.05rem;
            color:#cbd5e1;
        }
        .project-item{
            background:rgba(15,23,42,0.6);
            padding:16px 20px;
            border-radius:10px;
            margin-top:12px;
            border:1px solid rgba(56,189,248,0.12);
            transition: 0.25s ease;
        }
        .project-item:hover{
            border-color:rgba(56,189,248,0.4);
            box-shadow:0 0 12px rgba(56,189,248,0.15);
        }
        footer{
            margin-top:40px;
            text-align:center;
            font-size:0.9rem;
            color:#64748b;
        }
        @media(max-width:520px){
            .card{
                padding:26px 20px;
            }
            h1{
                font-size:2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Y.T_</h1>
        <div class="subtitle">集成电路专业｜Student</div>

        <h2>About Me</h2>
        <p>Interested in IC design, embedded system and programming.</p>

        <h2>Projects</h2>
        <div class="project-item">
            <p>C++ simulation program, digital circuit design.</p>
        </div>
    </div>
    <footer>
        © 2026 Y.T_ · Powered by GitHub Pages
    </footer>
</div>
</body>
</html>
